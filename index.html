<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tropaeum</title>
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --link: #0b5cad; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111111; --fg: #eeeeee; --link: #7ab8ff; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 1rem;
      display: grid;
      place-items: center;
      text-align: center;
      background: var(--bg);
      color: var(--fg);
      font: 1.125rem/1.5 system-ui, sans-serif;
    }
    h1 { margin: 0 0 0.5rem; font-size: 2.5rem; }
    p { margin: 0.5rem 0; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>Tropaeum</h1>
    <p>PlayStation trophies, tracked and shared. Coming soon.</p>
    <p><a href="https://lav.ren">lav.ren</a></p>
  </main>
</body>
</html>
